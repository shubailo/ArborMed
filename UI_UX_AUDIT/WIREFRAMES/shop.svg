<svg width="400" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="400" height="800" fill="#F4F1ED" rx="30" />

  <!-- Top Navigation / Header -->
  <rect x="20" y="40" width="360" height="80" fill="white" rx="20" filter="url(#shadow)" />
  <text x="40" y="75" font-family="sans-serif" font-weight="bold" font-size="22" fill="#3D4035">MEDICAL SUPPLY</text>
  <text x="40" y="95" font-family="sans-serif" font-weight="bold" font-size="10" fill="#8CAA8C" letter-spacing="2">DISPATCH TERMINAL</text>

  <!-- Coin HUD -->
  <rect x="280" y="55" width="80" height="40" fill="#F4F1ED" rx="20" />
  <circle cx="300" cy="75" r="12" fill="#FFD700" />
  <text x="320" y="80" font-family="sans-serif" font-weight="bold" font-size="16" fill="#3D4035">850</text>

  <!-- Empty / Error State Content -->
  <g transform="translate(0, 300)">
    <!-- Broken Box Illustration (Abstract) -->
    <rect x="150" y="0" width="100" height="80" fill="#E8DCD1" rx="10" />
    <polygon points="150,0 200,-30 250,0" fill="#D3C7BC" />
    <!-- Medical cross on box -->
    <rect x="185" y="25" width="30" height="10" fill="#8CAA8C" rx="2" />
    <rect x="195" y="15" width="10" height="30" fill="#8CAA8C" rx="2" />
    <!-- Broken line/crack -->
    <path d="M170,80 L180,50 L190,60 L210,0" fill="none" stroke="#F4F1ED" stroke-width="4" />

    <text x="200" y="130" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="18" fill="#3D4035">Our supply truck got a flat tire!</text>
    <text x="200" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#6B705C">
      <tspan x="200" dy="0">We couldn't connect to the warehouse.</tspan>
      <tspan x="200" dy="20">Please check your network and try again.</tspan>
    </text>

    <!-- Retry Button -->
    <rect x="100" y="220" width="200" height="50" fill="#8CAA8C" rx="15" filter="url(#shadow)" />
    <text x="200" y="252" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="16" fill="white">RE-FETCH STORAGE</text>
  </g>
</svg>
