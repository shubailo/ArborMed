<svg width="400" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="800" fill="#F4F1ED" rx="30" />

  <!-- Back Button & Title -->
  <rect x="20" y="40" width="360" height="60" fill="white" rx="20" filter="url(#shadow)" />
  <circle cx="50" cy="70" r="15" fill="#E8DCD1" />
  <path d="M55,65 L45,70 L55,75" fill="none" stroke="#3D4035" stroke-width="2" />
  <text x="160" y="75" font-family="sans-serif" font-weight="bold" font-size="18" fill="#3D4035">Medical Shop</text>

  <!-- Currency Balance -->
  <rect x="270" y="55" width="90" height="30" fill="#F4F1ED" rx="15" />
  <circle cx="285" cy="70" r="10" fill="#FFD700" />
  <text x="305" y="75" font-family="sans-serif" font-weight="bold" font-size="14" fill="#3D4035">1,250</text>

  <!-- Categories (Pills) -->
  <rect x="20" y="120" width="100" height="35" fill="#8CAA8C" rx="17.5" />
  <text x="70" y="142" font-family="sans-serif" font-weight="bold" font-size="14" fill="white" text-anchor="middle">Equipment</text>

  <rect x="130" y="120" width="90" height="35" fill="white" rx="17.5" filter="url(#shadow)" />
  <text x="175" y="142" font-family="sans-serif" font-weight="bold" font-size="14" fill="#806b5b" text-anchor="middle">Decor</text>

  <rect x="230" y="120" width="100" height="35" fill="white" rx="17.5" filter="url(#shadow)" />
  <text x="280" y="142" font-family="sans-serif" font-weight="bold" font-size="14" fill="#806b5b" text-anchor="middle">Apparel</text>

  <!-- Item Grid -->
  <g transform="translate(20, 180)">
    <!-- Item 1: Stethoscope -->
    <rect x="0" y="0" width="170" height="200" fill="white" rx="20" filter="url(#shadow)" />
    <rect x="20" y="20" width="130" height="100" fill="#F4F1ED" rx="15" />
    <circle cx="85" cy="70" r="30" fill="#8CAA8C" /> <!-- Icon Placeholder -->
    <text x="85" y="145" font-family="sans-serif" font-weight="bold" font-size="16" fill="#3D4035" text-anchor="middle">Stethoscope</text>
    <rect x="20" y="160" width="130" height="30" fill="#8CAA8C" rx="15" />
    <text x="85" y="180" font-family="sans-serif" font-weight="bold" font-size="14" fill="white" text-anchor="middle">500 Coins</text>
  </g>

  <g transform="translate(210, 180)">
    <!-- Item 2: Reflex Hammer -->
    <rect x="0" y="0" width="170" height="200" fill="white" rx="20" filter="url(#shadow)" />
    <rect x="20" y="20" width="130" height="100" fill="#F4F1ED" rx="15" />
    <rect x="70" y="40" width="30" height="60" fill="#8CAA8C" rx="5" /> <!-- Icon Placeholder -->
    <text x="85" y="145" font-family="sans-serif" font-weight="bold" font-size="16" fill="#3D4035" text-anchor="middle">Reflex Hammer</text>
    <rect x="20" y="160" width="130" height="30" fill="#E8DCD1" rx="15" />
    <text x="85" y="180" font-family="sans-serif" font-weight="bold" font-size="14" fill="#806b5b" text-anchor="middle">Purchased</text>
  </g>

  <g transform="translate(20, 400)">
    <!-- Item 3: Pulse Oximeter -->
    <rect x="0" y="0" width="170" height="200" fill="white" rx="20" filter="url(#shadow)" />
    <rect x="20" y="20" width="130" height="100" fill="#F4F1ED" rx="15" />
    <rect x="65" y="55" width="40" height="30" fill="#8CAA8C" rx="5" /> <!-- Icon Placeholder -->
    <text x="85" y="145" font-family="sans-serif" font-weight="bold" font-size="16" fill="#3D4035" text-anchor="middle">Pulse Oximeter</text>
    <rect x="20" y="160" width="130" height="30" fill="#8CAA8C" rx="15" />
    <text x="85" y="180" font-family="sans-serif" font-weight="bold" font-size="14" fill="white" text-anchor="middle">300 Coins</text>
  </g>

  <g transform="translate(210, 400)">
    <!-- Item 4: Ophthalmoscope -->
    <rect x="0" y="0" width="170" height="200" fill="white" rx="20" filter="url(#shadow)" />
    <rect x="20" y="20" width="130" height="100" fill="#F4F1ED" rx="15" />
    <rect x="80" y="40" width="10" height="60" fill="#8CAA8C" rx="5" /> <!-- Icon Placeholder -->
    <circle cx="85" cy="45" r="12" fill="#8CAA8C" />
    <text x="85" y="145" font-family="sans-serif" font-weight="bold" font-size="16" fill="#3D4035" text-anchor="middle">Ophthalmoscope</text>
    <rect x="20" y="160" width="130" height="30" fill="#8CAA8C" rx="15" />
    <text x="85" y="180" font-family="sans-serif" font-weight="bold" font-size="14" fill="white" text-anchor="middle">800 Coins</text>
  </g>

</svg>
