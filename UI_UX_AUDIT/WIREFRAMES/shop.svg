<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Background Image Placeholder (Isometric Room) -->
  <rect width="800" height="600" fill="#E8E2D9" />
  <text x="300" y="300" font-family="sans-serif" font-size="24" fill="#A09E9B" opacity="0.5">[ 3D Isometric Room Scene ]</text>

  <!-- Top Bar HUD -->
  <rect x="20" y="20" width="760" height="60" rx="30" fill="#FFFFFF" opacity="0.9" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))" />

  <!-- Stats: Stethoscopes (Coins) -->
  <rect x="250" y="35" width="24" height="24" rx="12" fill="#FFD54F" />
  <text x="280" y="52" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333333">1,450</text>

  <!-- Shop Window -->
  <rect x="150" y="120" width="500" height="360" rx="30" fill="#FFFFFF" opacity="0.95" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))" />
  <text x="180" y="160" font-family="sans-serif" font-size="16" font-weight="bold" fill="#333333">Medical Supplies</text>

</svg>
