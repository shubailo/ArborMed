<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#F4F1ED"/>

  <!-- "Broken Box" Illustration -->
  <g transform="translate(150, 100)">
    <path d="M0,50 L50,0 L100,50 L100,100 L0,100 Z" fill="#D2B48C" stroke="#8CAA8C" stroke-width="4"/>
    <path d="M50,0 L50,100" stroke="#8CAA8C" stroke-width="4"/>
    <path d="M0,50 L100,50" stroke="#8CAA8C" stroke-width="4" stroke-dasharray="8,8"/>
    <!-- Medical Cross -->
    <rect x="40" y="30" width="20" height="40" fill="#8CAA8C"/>
    <rect x="30" y="40" width="40" height="20" fill="#8CAA8C"/>
  </g>

  <!-- Error Text -->
  <text x="200" y="240" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333333" text-anchor="middle">
    Our supply truck got a flat tire!
  </text>
  <text x="200" y="265" font-family="sans-serif" font-size="14" fill="#666666" text-anchor="middle">
    Could not load the catalog.
  </text>

  <!-- Re-fetch Button -->
  <g transform="translate(120, 290)">
    <rect width="160" height="45" rx="8" fill="#8CAA8C"/>
    <text x="80" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">
      RE-FETCH STORAGE
    </text>
  </g>
</svg>
