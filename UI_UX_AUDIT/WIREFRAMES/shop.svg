<svg width="400" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="800" fill="#000000" fill-opacity="0.4" />

  <!-- Dialog Box -->
  <rect x="20" y="200" width="360" height="400" fill="#F4F1ED" rx="24" filter="url(#shadow)" />

  <!-- Illustration: Broken Medical Box -->
  <g transform="translate(140, 250)">
    <rect x="20" y="20" width="80" height="60" fill="#D3C7BC" rx="8" />
    <path d="M40 20 L60 0 L80 20" fill="none" stroke="#D3C7BC" stroke-width="4" />
    <line x1="20" y1="50" x2="100" y2="40" stroke="#8CAA8C" stroke-width="4" />
    <text x="60" y="60" font-family="sans-serif" font-size="24" text-anchor="middle">📦</text>
  </g>

  <!-- Text -->
  <text x="200" y="380" font-family="sans-serif" font-weight="bold" font-size="20" fill="#3D4035" text-anchor="middle">Out of Stock!</text>
  <text x="200" y="410" font-family="sans-serif" font-size="14" fill="#3D4035" text-anchor="middle">
    <tspan x="200" dy="0">Our supply truck got a flat tire!</tspan>
    <tspan x="200" dy="20">Re-fetch storage later.</tspan>
  </text>

  <!-- Action Button -->
  <rect x="80" y="480" width="240" height="50" fill="#8CAA8C" rx="15" />
  <text x="200" y="510" font-family="sans-serif" font-weight="bold" font-size="16" fill="white" text-anchor="middle">BACK TO LIST</text>
</svg>
