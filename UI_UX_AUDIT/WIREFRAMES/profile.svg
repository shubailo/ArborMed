<svg width="400" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="800" fill="#F4F1ED" rx="30" />

  <!-- Top Navigation -->
  <rect x="20" y="40" width="360" height="60" fill="white" rx="20" filter="url(#shadow)" />
  <!-- Back Button -->
  <circle cx="50" cy="70" r="15" fill="#E8DCD1" />
  <path d="M55,65 L45,70 L55,75" fill="none" stroke="#3D4035" stroke-width="2" />
  <text x="80" y="76" font-family="sans-serif" font-weight="bold" font-size="18" fill="#3D4035">Student Profile</text>

  <!-- Profile Header -->
  <circle cx="200" cy="180" r="50" fill="#8CAA8C" filter="url(#shadow)" />
  <text x="200" y="260" font-family="sans-serif" font-weight="bold" font-size="22" fill="#3D4035" text-anchor="middle">Dr. Jules</text>
  <text x="200" y="280" font-family="sans-serif" font-size="14" fill="#806b5b" text-anchor="middle">Level 3 Resident</text>

  <!-- Stats Container -->
  <rect x="20" y="320" width="360" height="100" fill="white" rx="20" filter="url(#shadow)" />
  <!-- Stat 1 -->
  <text x="80" y="350" font-family="sans-serif" font-size="12" fill="#806b5b" text-anchor="middle">Questions</text>
  <text x="80" y="380" font-family="sans-serif" font-weight="bold" font-size="24" fill="#3D4035" text-anchor="middle">1,420</text>
  <!-- Stat 2 -->
  <text x="200" y="350" font-family="sans-serif" font-size="12" fill="#806b5b" text-anchor="middle">Streak</text>
  <text x="200" y="380" font-family="sans-serif" font-weight="bold" font-size="24" fill="#3D4035" text-anchor="middle">🔥 14</text>
  <!-- Stat 3 -->
  <text x="320" y="350" font-family="sans-serif" font-size="12" fill="#806b5b" text-anchor="middle">Mastery</text>
  <text x="320" y="380" font-family="sans-serif" font-weight="bold" font-size="24" fill="#3D4035" text-anchor="middle">78%</text>

  <!-- Progress Section -->
  <rect x="20" y="440" width="360" height="150" fill="white" rx="20" filter="url(#shadow)" />
  <text x="40" y="475" font-family="sans-serif" font-weight="bold" font-size="16" fill="#3D4035">Next Rank: Attending</text>
  <rect x="40" y="500" width="320" height="12" fill="#E8DCD1" rx="6" />
  <rect x="40" y="500" width="200" height="12" fill="#8CAA8C" rx="6" />
  <text x="40" y="540" font-family="sans-serif" font-size="14" fill="#806b5b">2,500 XP to next rank</text>

  <!-- Settings Button -->
  <rect x="20" y="610" width="360" height="60" fill="#E8DCD1" rx="15" />
  <text x="200" y="646" font-family="sans-serif" font-weight="bold" font-size="16" fill="#3D4035" text-anchor="middle">ACCOUNT SETTINGS</text>
</svg>
