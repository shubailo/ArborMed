<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="600" fill="#F4F1ED" />

  <!-- Subtle Watermark Pattern -->
  <g opacity="0.05">
    <circle cx="100" cy="100" r="50" fill="#8CAA8C" />
    <circle cx="700" cy="500" r="80" fill="#8CAA8C" />
    <path d="M400,200 L450,250 L400,300 L350,250 Z" fill="#D2B48C" />
  </g>

  <!-- Top Bar -->
  <rect x="0" y="0" width="800" height="60" fill="#FFFFFF" opacity="0.9" />
  <text x="30" y="38" font-family="sans-serif" font-size="20" font-weight="bold" fill="#333333">ArborMed - Profile</text>

  <!-- Exit Button -->
  <rect x="700" y="15" width="70" height="30" rx="15" fill="#FFCDD2" />
  <text x="718" y="35" font-family="sans-serif" font-size="14" font-weight="bold" fill="#C62828">Exit</text>

  <!-- Profile Card -->
  <rect x="100" y="100" width="600" height="400" rx="16" fill="#FFFFFF" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))" />

  <text x="140" y="150" font-family="sans-serif" font-size="22" font-weight="bold" fill="#333333">Settings and Profile Details</text>

  <!-- Settings toggles -->
  <g transform="translate(140, 300)">
    <rect x="0" y="0" width="520" height="50" rx="8" fill="#F9F9F9" stroke="#E0E0E0" stroke-width="2" />
    <text x="20" y="32" font-family="sans-serif" font-size="16" fill="#333333">Enable Haptic Feedback</text>

    <rect x="0" y="65" width="520" height="50" rx="8" fill="#F9F9F9" stroke="#E0E0E0" stroke-width="2" />
    <text x="20" y="97" font-family="sans-serif" font-size="16" fill="#333333">Toggle Zen Mode</text>
  </g>

</svg>
