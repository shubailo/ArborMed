<svg width="400" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="400" height="800" fill="#F4F1ED" rx="30" />
  <rect x="20" y="40" width="360" height="60" fill="white" rx="20" filter="url(#shadow)" />
  <circle cx="50" cy="70" r="15" fill="#E8DCD1" />
  <path d="M55,65 L45,70 L55,75" fill="none" stroke="#3D4035" stroke-width="2" />
  <text x="160" y="76" font-family="sans-serif" font-weight="bold" font-size="18" fill="#3D4035">Profile</text>
  <circle cx="350" cy="70" r="15" fill="#F4F1ED" />
  <circle cx="200" cy="180" r="50" fill="#E8DCD1" filter="url(#shadow)" />
  <text x="200" y="190" font-family="sans-serif" font-size="30" text-anchor="middle">👨‍⚕️</text>
  <text x="200" y="260" font-family="sans-serif" font-weight="bold" font-size="22" fill="#3D4035" text-anchor="middle">Dr. Student</text>
  <text x="200" y="285" font-family="sans-serif" font-size="16" fill="#8CAA8C" text-anchor="middle">PGY-1 Resident</text>
  <g transform="translate(20, 320)">
    <rect x="0" y="0" width="170" height="80" fill="white" rx="20" filter="url(#shadow)" />
    <text x="85" y="35" font-family="sans-serif" font-weight="bold" font-size="24" fill="#3D4035" text-anchor="middle">120</text>
    <text x="85" y="60" font-family="sans-serif" font-size="14" fill="#666666" text-anchor="middle">Questions</text>
    <rect x="190" y="0" width="170" height="80" fill="white" rx="20" filter="url(#shadow)" />
    <text x="275" y="35" font-family="sans-serif" font-weight="bold" font-size="24" fill="#3D4035" text-anchor="middle">🔥 14</text>
    <text x="275" y="60" font-family="sans-serif" font-size="14" fill="#666666" text-anchor="middle">Day Streak</text>
  </g>
  <text x="30" y="450" font-family="sans-serif" font-weight="bold" font-size="18" fill="#3D4035">Daily Quests</text>
  <g transform="translate(20, 470)">
    <rect x="0" y="0" width="360" height="70" fill="white" rx="20" filter="url(#shadow)" />
    <circle cx="40" cy="35" r="15" fill="#8CAA8C" />
    <path d="M33,35 L38,40 L47,29" fill="none" stroke="white" stroke-width="2" />
    <text x="70" y="30" font-family="sans-serif" font-weight="bold" font-size="16" fill="#3D4035">Review 10 ECGs</text>
    <text x="70" y="50" font-family="sans-serif" font-size="14" fill="#666666">Completed • +50 XP</text>
  </g>
  <g transform="translate(20, 560)">
    <rect x="0" y="0" width="360" height="70" fill="white" rx="20" filter="url(#shadow)" />
    <circle cx="40" cy="35" r="15" fill="#E8DCD1" />
    <text x="70" y="30" font-family="sans-serif" font-weight="bold" font-size="16" fill="#3D4035">Complete a Duel</text>
    <rect x="70" y="42" width="200" height="8" fill="#F4F1ED" rx="4" />
    <rect x="70" y="42" width="100" height="8" fill="#8CAA8C" rx="4" />
    <text x="285" y="50" font-family="sans-serif" font-size="14" fill="#666666">0/1</text>
  </g>
  <rect x="40" y="720" width="320" height="60" fill="white" rx="30" filter="url(#shadow)" />
  <circle cx="90" cy="750" r="20" fill="#F4F1ED" />
  <circle cx="160" cy="750" r="20" fill="#F4F1ED" />
  <circle cx="230" cy="750" r="20" fill="#F4F1ED" />
  <circle cx="300" cy="750" r="20" fill="#E8F0E8" />
</svg>
