<svg width="400" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background (Dimmed Room) -->
  <rect width="400" height="800" fill="#3D4035" opacity="0.6" rx="30" />

  <!-- Bottom Sheet -->
  <rect x="0" y="300" width="400" height="500" fill="#F4F1ED" rx="30" filter="url(#shadow)" />
  <rect x="160" y="315" width="80" height="6" fill="#D3C7BC" rx="3" />

  <!-- Title -->
  <text x="40" y="360" font-family="sans-serif" font-weight="bold" font-size="24" fill="#3D4035">Settings</text>

  <rect x="330" y="335" width="30" height="30" fill="#E8DCD1" rx="15" />
  <path d="M340,340 L350,350 M350,340 L340,350" stroke="#3D4035" stroke-width="2" />

  <!-- Segmented Control (Main / About) -->
  <rect x="40" y="390" width="320" height="40" fill="#E8DCD1" rx="20" />
  <rect x="42" y="392" width="158" height="36" fill="white" rx="18" filter="url(#shadow)" />
  <text x="100" y="415" font-family="sans-serif" font-weight="bold" font-size="14" fill="#3D4035">General</text>
  <text x="260" y="415" font-family="sans-serif" font-size="14" fill="#806b5b">About</text>

  <!-- Settings List -->
  <!-- Volume -->
  <rect x="40" y="450" width="320" height="60" fill="white" rx="15" filter="url(#shadow)" />
  <circle cx="70" cy="480" r="15" fill="#8CAA8C" />
  <path d="M65,475 L70,475 L75,470 L75,485 L70,480 L65,480 Z M78,473 Q82,480 78,487" fill="none" stroke="white" stroke-width="2" />
  <text x="100" y="485" font-family="sans-serif" font-size="16" fill="#3D4035">Sound Effects</text>
  <rect x="300" y="470" width="40" height="20" fill="#8CAA8C" rx="10" />
  <circle cx="330" cy="480" r="8" fill="white" />

  <!-- Haptics -->
  <rect x="40" y="525" width="320" height="60" fill="white" rx="15" filter="url(#shadow)" />
  <circle cx="70" cy="555" r="15" fill="#D2B48C" />
  <!-- Phone vibrating icon -->
  <rect x="65" y="548" width="10" height="14" fill="none" stroke="white" stroke-width="2" rx="2" />
  <path d="M60,551 L60,559 M80,551 L80,559" stroke="white" stroke-width="1.5" />
  <text x="100" y="560" font-family="sans-serif" font-size="16" fill="#3D4035">Haptic Feedback</text>
  <rect x="300" y="545" width="40" height="20" fill="#8CAA8C" rx="10" />
  <circle cx="330" cy="555" r="8" fill="white" />

  <!-- Language -->
  <rect x="40" y="600" width="320" height="60" fill="white" rx="15" filter="url(#shadow)" />
  <circle cx="70" cy="630" r="15" fill="#806b5b" />
  <!-- Globe icon -->
  <circle cx="70" cy="630" r="8" fill="none" stroke="white" stroke-width="2" />
  <path d="M70,622 C65,622 65,638 70,638 C75,638 75,622 70,622 Z M62,630 L78,630" fill="none" stroke="white" stroke-width="1.5" />
  <text x="100" y="635" font-family="sans-serif" font-size="16" fill="#3D4035">Language</text>
  <text x="280" y="635" font-family="sans-serif" font-weight="bold" font-size="14" fill="#8CAA8C">English</text>
  <path d="M335,625 L345,630 L335,635" fill="none" stroke="#8CAA8C" stroke-width="2" />

  <!-- Logout Button -->
  <rect x="40" y="700" width="320" height="50" fill="#E8DCD1" rx="15" />
  <text x="175" y="730" font-family="sans-serif" font-weight="bold" font-size="16" fill="#D36B6B">LOGOUT</text>
</svg>
