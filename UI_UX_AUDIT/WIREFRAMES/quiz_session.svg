<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#FDFCF8" />
  <!-- Top Progress Bar -->
  <rect x="50" y="40" width="700" height="10" rx="5" fill="#E6E1D3" />
  <rect x="50" y="40" width="300" height="10" rx="5" fill="#8CAA8C" />
  <!-- Question Stem -->
  <rect x="100" y="100" width="600" height="150" rx="10" fill="#ffffff" />
  <text x="120" y="150" font-family="sans-serif" font-size="18" fill="#4A3728">A 45-year-old male presents with...</text>
  <!-- Options -->
  <rect x="100" y="280" width="600" height="50" rx="8" fill="#ffffff" stroke="#E6E1D3" stroke-width="2"/>
  <rect x="100" y="350" width="600" height="50" rx="8" fill="#8CAA8C" />
  <rect x="100" y="420" width="600" height="50" rx="8" fill="#ffffff" stroke="#E6E1D3" stroke-width="2"/>
  <rect x="100" y="490" width="600" height="50" rx="8" fill="#ffffff" stroke="#E6E1D3" stroke-width="2"/>
  <text x="120" y="310" font-family="sans-serif" font-size="16" fill="#8D6E63">Option A</text>
  <text x="120" y="380" font-family="sans-serif" font-size="16" fill="#ffffff">Option B (Selected)</text>
  <text x="120" y="450" font-family="sans-serif" font-size="16" fill="#8D6E63">Option C</text>
  <text x="120" y="520" font-family="sans-serif" font-size="16" fill="#8D6E63">Option D</text>
</svg>