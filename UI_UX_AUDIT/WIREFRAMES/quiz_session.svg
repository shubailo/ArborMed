<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <!-- Background: Solid/Themed (No 3D Room) -->
  <rect width="375" height="812" fill="#F4F1ED" />

  <!-- Top Bar: Progress & Exit -->
  <path d="M20,60 L40,60 M20,50 L30,60 L20,70" stroke="#5A6C5A" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="70" y="55" width="240" height="10" rx="5" fill="#E8E2D9" />
  <rect x="70" y="55" width="160" height="10" rx="5" fill="#8CAA8C" />
  <text x="330" y="65" font-family="sans-serif" font-size="16" fill="#5A6C5A" font-weight="bold">7/10</text>

  <!-- Question Stem Area -->
  <rect x="20" y="100" width="335" height="200" rx="16" fill="#FFF" stroke="#E8E2D9" stroke-width="1" />
  <text x="40" y="140" font-family="sans-serif" font-size="18" fill="#333" font-weight="bold" width="295">A 45-year-old male presents...</text>
  <text x="40" y="170" font-family="sans-serif" font-size="16" fill="#555" width="295">with acute onset shortness of breath</text>
  <text x="40" y="195" font-family="sans-serif" font-size="16" fill="#555" width="295">and pleuritic chest pain.</text>
  <text x="40" y="240" font-family="sans-serif" font-size="16" fill="#5A6C5A" font-weight="bold" width="295">What is the most likely diagnosis?</text>

  <!-- Answer Options -->
  <rect x="20" y="320" width="335" height="60" rx="12" fill="#FFF" stroke="#E8E2D9" stroke-width="2" />
  <text x="40" y="355" font-family="sans-serif" font-size="16" fill="#333">A. Pulmonary Embolism</text>

  <rect x="20" y="395" width="335" height="60" rx="12" fill="#FFF" stroke="#E8E2D9" stroke-width="2" />
  <text x="40" y="430" font-family="sans-serif" font-size="16" fill="#333">B. Myocardial Infarction</text>

  <rect x="20" y="470" width="335" height="60" rx="12" fill="#FFF" stroke="#E8E2D9" stroke-width="2" />
  <text x="40" y="505" font-family="sans-serif" font-size="16" fill="#333">C. Pneumothorax</text>

  <rect x="20" y="545" width="335" height="60" rx="12" fill="#FFF" stroke="#E8E2D9" stroke-width="2" />
  <text x="40" y="580" font-family="sans-serif" font-size="16" fill="#333">D. Aortic Dissection</text>

  <!-- Submit Button -->
  <rect x="20" y="730" width="335" height="60" rx="30" fill="#8CAA8C" />
  <text x="187.5" y="767" font-family="sans-serif" font-size="18" fill="#FFF" font-weight="bold" text-anchor="middle">Submit Answer</text>
</svg>
