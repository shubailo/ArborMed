<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#F4F1ED" />

  <!-- App Bar -->
  <rect x="0" y="0" width="800" height="60" fill="#FFFFFF" />
  <text x="400" y="38" font-family="sans-serif" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">ECG Interpretation</text>
  <path d="M 20 30 L 35 15 L 35 45 Z" fill="#8CAA8C" />

  <!-- Progress Stepper -->
  <rect x="50" y="80" width="700" height="40" fill="#FFFFFF" rx="20" />
  <line x1="100" y1="100" x2="700" y2="100" stroke="#E0E0E0" stroke-width="4" />
  <line x1="100" y1="100" x2="250" y2="100" stroke="#8CAA8C" stroke-width="4" />

  <!-- Step 1: Rhythm (Completed) -->
  <circle cx="100" cy="100" r="15" fill="#8CAA8C" />
  <text x="100" cy="105" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">✓</text>
  <text x="100" cy="135" font-family="sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">Rhythm</text>

  <!-- Step 2: Rate (Active) -->
  <circle cx="250" cy="100" r="15" fill="#FFFFFF" stroke="#8CAA8C" stroke-width="4" />
  <circle cx="250" cy="100" r="6" fill="#8CAA8C" />
  <text x="250" cy="135" font-family="sans-serif" font-size="12" font-weight="bold" fill="#8CAA8C" text-anchor="middle">Rate</text>

  <!-- Step 3: Conduction -->
  <circle cx="400" cy="100" r="15" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="4" />
  <text x="400" cy="135" font-family="sans-serif" font-size="12" font-weight="normal" fill="#999" text-anchor="middle">Conduction</text>

  <!-- Step 4: Axis -->
  <circle cx="550" cy="100" r="15" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="4" />
  <text x="550" cy="135" font-family="sans-serif" font-size="12" font-weight="normal" fill="#999" text-anchor="middle">Axis</text>

  <!-- Step 5: Morphology -->
  <circle cx="700" cy="100" r="15" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="4" />
  <text x="700" cy="135" font-family="sans-serif" font-size="12" font-weight="normal" fill="#999" text-anchor="middle">Morphology</text>

  <!-- Content Area -->
  <rect x="50" y="160" width="700" height="340" fill="#FFFFFF" rx="10" />

  <text x="80" y="200" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">2. Rate Analysis</text>

  <text x="80" y="240" font-family="sans-serif" font-size="14" fill="#666">Calculate the ventricular rate (bpm):</text>
  <rect x="80" y="260" width="200" height="40" fill="#F9F9F9" stroke="#CCC" rx="5" />
  <text x="90" y="285" font-family="sans-serif" font-size="14" fill="#999">Enter rate...</text>

  <text x="80" y="330" font-family="sans-serif" font-size="14" fill="#666">Select rate category:</text>
  <rect x="80" y="350" width="150" height="40" fill="#8CAA8C" rx="5" />
  <text x="155" y="375" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Bradycardia</text>

  <rect x="240" y="350" width="150" height="40" fill="#FFFFFF" stroke="#CCC" rx="5" />
  <text x="315" y="375" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">Normal</text>

  <rect x="400" y="350" width="150" height="40" fill="#FFFFFF" stroke="#CCC" rx="5" />
  <text x="475" y="375" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">Tachycardia</text>

  <!-- Navigation Buttons -->
  <rect x="50" y="520" width="120" height="45" fill="#FFFFFF" stroke="#8CAA8C" stroke-width="2" rx="22.5" />
  <text x="110" y="548" font-family="sans-serif" font-size="14" font-weight="bold" fill="#8CAA8C" text-anchor="middle">BACK</text>

  <rect x="630" y="520" width="120" height="45" fill="#8CAA8C" rx="22.5" />
  <text x="690" y="548" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">NEXT</text>

</svg>
