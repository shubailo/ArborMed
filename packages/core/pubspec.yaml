name: arbormed_core
description: Core shared logic and models for ArborMed Flutter apps.
version: 0.0.1
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^13.0.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  path: ^1.9.0
  drift: ^2.31.0
  sqlite3_flutter_libs: ^0.6.0
  logger: ^2.3.0
  google_fonts: ^6.3.3
  flutter_staggered_grid_view: ^0.7.0
  provider: ^6.0.5
  vibration: ^3.1.6
  http: ^1.1.0
  intl: ^0.20.2
  audioplayers: ^6.5.1
  image_picker: ^1.0.7
  fl_chart: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  drift_dev: ^2.31.0

flutter:
  generate: true
  uses-material-design: true
